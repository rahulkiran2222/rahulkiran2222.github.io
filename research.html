<section class="hero wrap">
<div><div class="kicker">02 / Research</div><h1>Questions<br>worth <em>testing.</em></h1><p class="lede">Research at the intersection of intelligent systems and real-world responsibility — asking where AI systems fail, how those failures can be measured, and how evidence can become an engineering tool.</p></div>
<aside class="manifesto"><div class="kicker">Research principle</div><strong>Don't just ask whether a model works. Ask what it believes, what supports it, and what happens when it fails.</strong><p>The portfolio connects model architecture, grounding, safety, cognition, language, efficiency, and Earth-scale applications.</p><small>QUESTION → EVIDENCE → EXPERIMENT → ARTIFACT</small></aside>
</section>

<section class="section"><div class="wrap">
<div class="kicker">01 / Core research</div><h2>Four questions at the center.</h2><p class="section-intro">These are the strongest research threads represented by the public work. Each card separates the research question from the artifact so the page remains honest about what is a paper, experiment, or software system.</p>
<div class="research-grid">
<article class="research-card" style="--accent:#bd4e2a"><div class="num"><span>R01</span><span>LLM RELIABILITY</span></div><h3>LLM Grounding Deficit</h3><div class="question">QUESTION / When does plausible language lose contact with evidence?</div><p>A unified framing for a grounding deficit in language models: generated language can be fluent and convincing while lacking sufficient anchoring to evidence, source material, or task context.</p><div class="record"><span class="chip">GROUNDING</span><span class="chip">HALLUCINATION</span><span class="chip">EVALUATION</span><a href="https://github.com/rahulkiran2222/llm-grounding-deficit" target="_blank" rel="noopener noreferrer">REPOSITORY ↗</a></div></article>
<article class="research-card" style="--accent:#bd4e2a"><div class="num"><span>R02</span><span>AI SAFETY</span></div><h3>Prompt Injection Lab</h3><div class="question">QUESTION / Can retrieval become an attack surface?</div><p>Research and experimentation around indirect prompt injection in Retrieval-Augmented Generation, focusing on how untrusted retrieved content can influence an AI system's behavior.</p><div class="record"><span class="chip">PROMPT INJECTION</span><span class="chip">RAG</span><span class="chip">RED TEAMING</span><a href="https://github.com/rahulkiran2222/prompt-injection-lab" target="_blank" rel="noopener noreferrer">REPOSITORY ↗</a></div></article>
<article class="research-card" style="--accent:#557b88"><div class="num"><span>R03</span><span>LANGUAGE / REPRESENTATION</span></div><h3>Tokenizer-Bias</h3><div class="question">QUESTION / What happens when languages are represented unevenly?</div><p>An empirical investigation of byte-level and subword representations for Indic languages, connecting tokenization choices with multilingual model behavior and representation efficiency.</p><div class="record"><span class="chip">INDIC NLP</span><span class="chip">TOKENIZATION</span><span class="chip">BIAS</span><a href="https://github.com/rahulkiran2222/Tokenizer-Bias" target="_blank" rel="noopener noreferrer">REPOSITORY ↗</a></div></article>
<article class="research-card" style="--accent:#765b88"><div class="num"><span>R04</span><span>COGNITIVE AI</span></div><h3>LLM Cognitive Biases</h3><div class="question">QUESTION / Do language models reproduce classical cognitive biases?</div><p>Experimental work replicating classical human cognitive-bias tasks with Large Language Models to examine systematic patterns in model reasoning and judgment.</p><div class="record"><span class="chip">COGNITION</span><span class="chip">REASONING</span><span class="chip">BIAS</span><a href="https://github.com/rahulkiran2222/llm-cognitive-biases" target="_blank" rel="noopener noreferrer">REPOSITORY ↗</a></div></article>
<article class="research-card" id="models" style="--accent:#557b88"><div class="num"><span>R05</span><span>INTERACTIVE 3D</span></div><h3>3D Model Playground</h3><div class="question">QUESTION / What happens when model interaction becomes embodied?</div><p>An interactive web app using Three.js, MediaPipe computer vision, Web Speech API and real-time gesture/voice controls to manipulate 3D models.</p><div class="chips"><span class="chip">THREE.JS</span><span class="chip">MEDIAPIPE</span><span class="chip">WEB SPEECH</span></div><div class="actions"><a href="https://github.com/rahulkiran2222/3D-Model-Playground" target="_blank" rel="noopener noreferrer">REPOSITORY + README ↗</a><a class="live" href="https://raphussolutions.github.io/" target="_blank" rel="noopener noreferrer">LIVE DEMO ↗</a></div></article></div></div></section>

<section class="section"><div class="wrap">
<div class="kicker">02 / Research method</div><h2>How a question becomes evidence.</h2>
<div class="ladder">
<div class="step"><div class="stepno">01 / QUESTION</div><div><h3>Define the failure or phenomenon</h3><p>Start with a precise behavior, gap, bias, threat, or environmental problem rather than a vague claim about AI.</p></div><div class="arrow">→</div></div>
<div class="step"><div class="stepno">02 / TEST</div><div><h3>Construct an experiment</h3><p>Translate the question into tasks, baselines, controlled conditions, datasets, or system-level evaluations.</p></div><div class="arrow">→</div></div>
<div class="step"><div class="stepno">03 / MEASURE</div><div><h3>Look for reproducible evidence</h3><p>Separate observations from interpretation and make the evidence inspectable wherever the artifact permits it.</p></div><div class="arrow">→</div></div>
<div class="step"><div class="stepno">04 / RELEASE</div><div><h3>Turn the result into an artifact</h3><p>Paper, repository, visualization, benchmark, tutorial, or open knowledge resource — something another person can inspect.</p></div><div class="arrow">↗</div></div>
</div></div></section>
